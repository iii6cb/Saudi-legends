<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رتب أساطير الدوري السعودي</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0f6b36;--g2:#0c5f30;--deep:#073d1f;--chalk:#f5f7f0;--gold:#f2c230;--ink:#0a2415;
--s:#e0ac1f;--a:#e8702a;--b:#2f7fd1;--c:#8a63c9;--d:#c2453f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--g2)}
body{margin:0;min-height:100vh;color:var(--chalk);font-family:"Tajawal",system-ui,sans-serif;line-height:1.6;background:repeating-linear-gradient(90deg,var(--g1) 0 72px,var(--g2) 72px 144px);background-attachment:fixed}
main{max-width:1180px;margin:0 auto;padding:26px 20px 48px}
h1{font-family:"Reem Kufi","Tajawal",sans-serif;font-size:clamp(30px,8vw,52px);line-height:1.25;margin:8px 0 6px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28)}
h1::after{content:"";display:block;width:96px;height:5px;margin-top:8px;background:var(--gold);border-radius:3px}
.sub{margin:10px 0 18px;color:rgba(255,255,255,.85)}
.board{position:relative;border:3px solid var(--chalk);border-radius:6px;overflow:hidden;background:rgba(7,61,31,.82);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.row{display:flex;min-height:84px;border-bottom:3px solid var(--chalk);cursor:pointer}
.row:last-child{border-bottom:0}
.label{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--on);text-align:center;padding:6px;border-left:3px solid var(--chalk)}
.label b{font-family:"Reem Kufi",sans-serif;font-size:36px;line-height:1}
.label span{font-size:12px;margin-top:4px;font-weight:700}
.slot{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:8px;align-content:flex-start}
.row.over .slot,.pool.over{background:rgba(242,194,48,.22)}
.pool{margin-top:20px;border:3px dashed rgba(255,255,255,.6);border-radius:6px;padding:10px;min-height:92px;cursor:pointer;background:rgba(0,0,0,.18)}
.pool h2{font-size:15px;margin:0 0 8px;color:var(--chalk);font-weight:700}
.pool .slot{padding:0}
.card{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #fff;border-radius:999px;padding:4px 6px 4px 14px;font:inherit;font-weight:700;color:var(--ink);cursor:grab;touch-action:manipulation;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.card:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,194,48,.55)}
.card .av{width:34px;height:34px;border-radius:50%;background:var(--g1);color:#fff;display:grid;place-items:center;font-family:"Reem Kufi",sans-serif;font-size:17px;flex:none}
.card.ph{padding:3px;border-radius:12px}
.card.ph img{height:68px;width:auto;max-width:96px;border-radius:9px;display:block}
.wm{pointer-events:none;font-weight:700;font-size:12px;line-height:1.5;letter-spacing:.3px;color:#fff;background:rgba(0,0,0,.35);padding:0 7px;border-radius:999px;margin-bottom:4px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.credit{margin-top:28px;padding-top:14px;border-top:2px solid rgba(255,255,255,.3);text-align:center;font-size:14px;color:rgba(255,255,255,.85)}
.credit a{color:var(--gold);font-weight:700;text-decoration:none}.credit a svg{width:14px;height:14px;fill:currentColor;vertical-align:-2px;margin-inline-end:6px}.wm svg{width:10px;height:10px;fill:currentColor;vertical-align:-1px;margin-inline-end:4px}@media (max-width:600px){.wm{font-size:11px;padding:0 5px}.wm svg{width:9px;height:9px;margin-inline-end:3px}}.credit a:hover,.credit a:focus-visible{text-decoration:underline}
.hint{margin:12px 0 0;font-size:14px;color:rgba(255,255,255,.88);min-height:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-weight:700;border:2px solid var(--gold);background:var(--gold);color:var(--ink);border-radius:6px;padding:9px 18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn.alt{background:transparent;color:var(--chalk);border-color:var(--chalk)}
@media (max-width:600px){main{padding:12px 10px 28px}h1{font-size:26px}h1::after{height:4px;margin-top:6px}.sub{font-size:13px;margin:8px 0 10px}.row{min-height:76px}.label{flex-basis:76px;padding:4px}.label b{font-size:26px}.label span{font-size:11px}.slot{gap:6px;padding:6px}.card.ph img{height:58px;max-width:82px}.pool{margin-top:12px;padding:8px;min-height:80px}.pool h2{font-size:13px;margin-bottom:6px}.hint{margin-top:8px}.bar{margin-top:10px}.credit{margin-top:16px;padding-top:10px}}
@media (min-width:900px){.row{min-height:104px}.label{flex-basis:130px}.label b{font-size:46px}.label span{font-size:14px}.slot{gap:12px;padding:12px}.card.ph img{height:88px;max-width:124px}.sub{font-size:18px}.pool{min-height:110px}}
</style>
</head>

var TIERS=[
{k:"S",n:"الأعظم",c:"var(--s)"},{k:"A",n:"عملاق",c:"var(--a)"},{k:"B",n:"نجم كبير",c:"var(--b)"},
{k:"C",n:"جيد",c:"var(--c)"},{k:"D",n:"أقل",c:"var(--d)"}];
var KEY="saudi-legends-tier-v2";
var state={};PLAYERS.forEach(function(p){state[p.id]="pool"});
var selected=null;
try{var saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved){PLAYERS.forEach(function(p){if(saved[p.id])state[p.id]=saved[p.id]})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
var board=document.getElementById("board"),poolSlot=document.getElementById("poolSlot"),hint=document.getElementById("hint");
var slots={};
TIERS.forEach(function(t){
var row=document.createElement("div");row.className="row";row.dataset.tier=t.k;
row.innerHTML='<div class="label" style="background:'+t.c+'"><b>'+t.k+'</b><span>'+t.n+'</span></div><div class="slot"></div>';
board.appendChild(row);slots[t.k]=row.querySelector(".slot");
if(t.k==="B"){var wmEl=document.getElementById("wm");var lb=row.querySelector(".label");if(wmEl&&lb)lb.insertBefore(wmEl,lb.firstChild)}
row.addEventListener("click",function(e){if(e.target.closest(".card"))return;place(t.k)});
wireDrop(row,t.k);
});
slots.pool=poolSlot;
var poolBox=document.getElementById("pool");
poolBox.addEventListener("click",function(e){if(e.target.closest(".card"))return;place("pool")});
wireDrop(poolBox,"pool");
function wireDrop(el,k){
el.addEventListener("dragover",function(e){e.preventDefault();el.classList.add("over")});
el.addEventListener("dragleave",function(){el.classList.remove("over")});
el.addEventListener("drop",function(e){e.preventDefault();el.classList.remove("over");var id=e.dataTransfer.getData("text/plain");if(state[id]!==undefined){state[id]=k;selected=null;render()}});
}
function place(k){
if(!selected){hint.textContent="اختر لاعبًا أولًا بلمس اسمه.";return}
state[selected]=k;selected=null;render();
}
function render(){
Object.keys(slots).forEach(function(k){slots[k].innerHTML=""});
PLAYERS.forEach(function(p){
var b=document.createElement("button");b.type="button";b.className="card"+(selected===p.id?" sel":"");
b.draggable=true;if(PHOTOS[p.id]){b.className+=" ph";b.innerHTML='<img alt="'+p.name+'" src="'+PHOTOS[p.id]+'">'}else{b.innerHTML='<span class="av">'+p.name.charAt(0)+'</span>'+p.name}
b.addEventListener("click",function(e){e.stopPropagation();selected=(selected===p.id?null:p.id);render();if(selected)hint.textContent="الآن المس المستوى الذي تريده للاعب المحدد.";else hint.textContent=""});
b.addEventListener("dragstart",function(e){e.dataTransfer.setData("text/plain",p.id);selected=null});
slots[state[p.id]].appendChild(b);
});
var left=PLAYERS.filter(function(p){return state[p.id]==="pool"}).length;
if(!selected)hint.textContent=left===0?"اكتمل ترتيبك.":"بقي "+left+" من "+PLAYERS.length+" لم يُرتَّبوا.";
save();
}
document.getElementById("reset").addEventListener("click",function(){PLAYERS.forEach(function(p){state[p.id]="pool"});selected=null;render()});
render();
</script>
